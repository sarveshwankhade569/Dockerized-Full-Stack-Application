name: Build, Push to Docker Hub, Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2]
    steps:
      - name: Checkout (for compose file and init.sql)
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy with Docker Compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cp ~/app/.env .env
          docker compose -p fullstack -f docker-compose.prod.yml pull
          docker compose -p fullstack -f docker-compose.prod.yml up -d
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 3
          done
          docker compose -p fullstack -f docker-compose.prod.yml logs
          exit 1
