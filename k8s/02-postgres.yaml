apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: fullstack }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: fullstack, labels: { app: postgres } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432 }]
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
        env:
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "postgres", "-d", "fullstack_db"] }
          periodSeconds: 5
        livenessProbe:
          exec: { command: ["pg_isready", "-U", "postgres", "-d", "fullstack_db"] }
          initialDelaySeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: postgres-data }
      - name: init
        configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: fullstack }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
