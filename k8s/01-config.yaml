apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: fullstack }
data:
  POSTGRES_DB: fullstack_db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: fullstack_db
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata: { name: app-secret, namespace: fullstack }
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_secure_dev_password
  DB_USER: postgres
  DB_PASSWORD: postgres_secure_dev_password
