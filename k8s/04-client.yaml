apiVersion: apps/v1
kind: Deployment
metadata: { name: client, namespace: fullstack, labels: { app: client } }
spec:
  replicas: 2
  selector: { matchLabels: { app: client } }
  template:
    metadata: { labels: { app: client } }
    spec:
      containers:
      - name: client
        image: sarveshwankhade569/fullstack-client:latest
        ports: [{ containerPort: 80 }]     # change if your nginx listens on 3000
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /, port: 80 }   # same port as above
        livenessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: client, namespace: fullstack }
spec:
  selector: { app: client }
  ports: [{ port: 80, targetPort: 80 }]    # targetPort = the container port above
