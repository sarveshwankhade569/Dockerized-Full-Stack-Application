apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: fullstack, labels: { app: api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for db; sleep 2; done']
      containers:
      - name: api
        image: sarveshwankhade569/fullstack-server:latest
        ports: [{ containerPort: 5000 }]
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
        readinessProbe:
          httpGet: { path: /api/health, port: 5000 }
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket: { port: 5000 }
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: fullstack }
spec:
  selector: { app: api }
  ports: [{ port: 5000, targetPort: 5000 }]
